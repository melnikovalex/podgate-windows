name: ci

# Tags only. Every other trigger built the same thing again: pushing a release moved main and the tag,
# which is two events and two ten-minute Windows builds for one release. Work is built locally with
# build.ps1 before it is tagged, so the pipeline exists to produce and publish the release, nothing else.
on:
  push:
    tags: ['v*']

# A re-pushed tag supersedes its own run rather than racing it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: build
        run: dotnet build PodGate.slnx -c Release

      - name: test
        run: dotnet test tests/PodGate.Core.Tests/PodGate.Core.Tests.csproj -c Release --no-build

      # Keep in step with the list in build.ps1's header; a missing extension only shows up here.
      - name: install wix
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
          wix extension add -g WixToolset.BootstrapperApplications.wixext/5.0.2

      - name: build installer
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1

      - uses: actions/upload-artifact@v5
        with:
          name: installer
          path: |
            artifacts/setup/*.msi
            artifacts/setup/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: check tag
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ("v$version" -ne '${{ github.ref_name }}') { throw "tag ${{ github.ref_name }} does not match VERSION $version" }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw 'releases are tagged on main' }

      - uses: actions/download-artifact@v5
        with:
          name: installer
          path: dist

      # The release notes are the tag's own message. Generated notes would only list the single squashed
      # commit that main receives per release, which says nothing about what changed.
      #
      # The explicit fetch is load-bearing: checkout writes the tag as a lightweight ref, so the annotated
      # tag object is missing and %(contents) silently falls back to the commit message. The first release
      # went out with "install the bootstrapper extension in ci" as its description because of this.
      - name: publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin --force --tags
          if ((git cat-file -t '${{ github.ref_name }}') -ne 'tag') { throw 'not an annotated tag, so there are no release notes' }
          $notes = git tag -l --format='%(contents)' '${{ github.ref_name }}'
          if (-not $notes) { throw 'the tag has no message, so there are no release notes' }
          $notes | Out-File -FilePath notes.md -Encoding utf8
          $files = Get-ChildItem dist/* -Include *.msi, *.exe | ForEach-Object { $_.FullName }
          gh release create '${{ github.ref_name }}' $files --title 'PodGate ${{ github.ref_name }}' --notes-file notes.md
