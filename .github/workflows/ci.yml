name: ci

on:
  push:
    branches: [dev, main]
    tags: ['v*']
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: build
        run: dotnet build PodGate.slnx -c Release

      - name: test
        run: dotnet test tests/PodGate.Core.Tests/PodGate.Core.Tests.csproj -c Release --no-build

      - name: install wix
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2

      - name: build installer
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1

      - uses: actions/upload-artifact@v5
        with:
          name: installer
          path: |
            artifacts/setup/*.msi
            artifacts/setup/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: check tag
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ("v$version" -ne '${{ github.ref_name }}') { throw "tag ${{ github.ref_name }} does not match VERSION $version" }
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw 'releases are tagged on main' }

      - uses: actions/download-artifact@v5
        with:
          name: installer
          path: dist

      # The release notes are the tag's own message. Generated notes would only list the single squashed
      # commit that main receives per release, which says nothing about what changed.
      - name: publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = git tag -l --format='%(contents)' '${{ github.ref_name }}'
          if (-not $notes) { throw 'the tag has no message, so there are no release notes' }
          $notes | Out-File -FilePath notes.md -Encoding utf8
          $files = Get-ChildItem dist/* -Include *.msi, *.exe | ForEach-Object { $_.FullName }
          gh release create '${{ github.ref_name }}' $files --title 'PodGate ${{ github.ref_name }}' --notes-file notes.md
